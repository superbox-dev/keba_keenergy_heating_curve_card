exclude = '^node_modules/'

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "mixed-line-ending" },
  { id = "detect-private-key" },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/editorconfig-checker/editorconfig-checker.python"
rev = "3.11.1"
hooks = [
  { id = "editorconfig-checker" }
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.6"
hooks = [
  { id = "rumdl-check" }
]

[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"
hooks = [
  { id = "yamllint" }
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "eslint"
name = "eslint"
entry = "npx eslint --no-warn-ignored"
language = "system"
types = ["javascript"]

[[repos.hooks]]
id = "typecheck"
name = "tsc"
entry = "npm run typecheck"
language = "system"
files = '^(src/|test/|tsconfig\.json$)'
pass_filenames = false

[[repos.hooks]]
id = "test"
name = "npm run test:coverage"
entry = "npm run test:coverage"
language = "system"
files = '^(src/|test/)'
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "test-dist"
name = "npm run test:dist"
entry = "npm run test:dist"
language = "system"
files = '^(src/|test/|build\.mjs$|package\.json$)'
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "test-e2e"
name = "npm run test:e2e"
entry = "npm run test:e2e"
language = "system"
files = '^(src/|test/)'
pass_filenames = false
require_serial = true
