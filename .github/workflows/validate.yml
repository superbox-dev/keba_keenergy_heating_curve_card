name: Validate

# Like the HACS example: on every push and pull request, every night and on demand.
# HACS checks the repository on GitHub and the asset of the latest release, not a build of this run.
on:
  push:
  pull_request:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a  # 22.5.0
        with:
          category: plugin
