name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: 30 5 * * *
  push:
    branches:
      - '**'
    tags:
      - v*

jobs:
  code-analysis:
    name: Code analysis
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Lint JavaScript files with eslint
        run: npx eslint .
      - name: Check JSDoc types
        run: npm run typecheck
      - name: Lint YAML files
        run: npx prek run yamllint --all-files
      - name: Lint Markdown files
        run: npx prek run rumdl-check --all-files
      - name: Check files against .editorconfig
        run: npx prek run editorconfig-checker --all-files

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      # OIDC token for the Codecov upload, no secret needed.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Build card and run smoke tests of the bundle
        run: npm run test:dist
      - name: Check HACS file name
        run: |
          # HACS looks for the file named after the repository.
          FILE="dist/${GITHUB_REPOSITORY#*/}.js"

          if [[ ! -s "$FILE" ]]; then
            echo "::error::$FILE is missing or empty, HACS will not find the card"
            exit 1
          fi

          echo "Found $FILE"
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: test/coverage/lcov.info
          disable_search: true
          # Pull requests from forks and Dependabot get no OIDC token and upload without one.
          use_oidc: ${{ !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
          fail_ci_if_error: true
      - name: Upload card
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: card
          path: dist
          if-no-files-found: error

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e

  validation:
    name: Validation
    runs-on: ubuntu-latest
    # HACS checks the asset of the latest release, so on a tag it waits for the new release.
    # Without a tag the release is skipped and the validation still runs.
    needs:
      - release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a  # 22.5.0
        with:
          category: plugin

  security:
    name: Audit packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Audit npm packages
        run: npm audit --omit=dev --audit-level=high

  release:
    name: Release on GitHub
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs:
      - code-analysis
      - build
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Check release metadata
        run: ./scripts/check-release.sh "${GITHUB_REF_NAME}"
      - name: Download files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: card
          path: dist
      - name: Check if prerelease
        id: check_prerelease
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG_NAME"

          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "🟡 Pre-release detected"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "🟢 Regular release"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release notes
        env:
          PRERELEASE: ${{ steps.check_prerelease.outputs.prerelease }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          HEADING="$(grep -m 1 -F "## [${VERSION}]" CHANGELOG.md | sed 's/^## //' || true)"

          if [[ -n "$HEADING" ]]; then
            # Same anchor as GitHub: lowercase, without punctuation, spaces as hyphens.
            ANCHOR="$(echo "$HEADING" | tr '[:upper:]' '[:lower:]' | tr -d -c 'a-z0-9 _-' | tr ' ' '-')"
          elif [[ "$PRERELEASE" == "true" ]]; then
            ANCHOR="unreleased"
          else
            echo "::error::No section for ${VERSION} in CHANGELOG.md"
            exit 1
          fi

          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG_NAME}/CHANGELOG.md#${ANCHOR}"
          echo "See the [changelog](${URL}) for all changes." > release-notes.md
          cat release-notes.md
      - name: Release on GitHub
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          prerelease: ${{ steps.check_prerelease.outputs.prerelease }}
          body_path: release-notes.md
          files: ${{ github.workspace }}/dist/keba_keenergy_heating_curve_card.js
      - name: Delete old pre-releases and their tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"

          git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' |
            while read -r TAG; do
              if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ || "$TAG" == "$TAG_NAME" ]]; then
                continue
              fi

              if gh release view "$TAG" > /dev/null 2>&1; then
                echo "Deleting pre-release and tag $TAG"
                gh release delete "$TAG" --yes --cleanup-tag
              else
                echo "Deleting tag $TAG"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
              fi
            done

  release-check:
    name: Check the release file
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs:
      - release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Download the file like HACS
        run: |
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/keba_keenergy_heating_curve_card.js"
          mkdir -p dist
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output dist/keba_keenergy_heating_curve_card.js "$URL"
      - name: Run smoke tests of the release file
        run: npx vitest run --config test/vitest.dist.config.js
