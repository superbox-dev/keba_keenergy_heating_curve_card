name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: 30 5 * * *
  push:
    branches:
      - main

jobs:
  code-analysis:
    name: Code analysis
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Lint JavaScript files with eslint
        run: npx eslint .
      - name: Lint YAML files
        run: npx prek run yamllint --all-files
      - name: Lint Markdown files
        run: npx prek run rumdl-check --all-files
      - name: Check files against .editorconfig
        run: npx prek run editorconfig-checker --all-files

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Build card
        run: npm run build
      - name: Run tests
        run: npm test

  validation:
    name: Validation
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a  # 22.5.0
        with:
          category: plugin

  security:
    name: Audit packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: False
      - name: Set up project
        uses: ./.github/actions/setup-project
      - name: Audit npm packages
        run: npm audit --omit=dev --audit-level=high
